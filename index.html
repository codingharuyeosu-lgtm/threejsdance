<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지홍이 타격 클리커</title>
  <style>
    :root {
      --bg-color: #0f0b1a;
      --card-bg: rgba(26, 19, 48, 0.85);
      --card-border: #4a2c82;
      --accent-color: #a855f7;
      --accent-gold: #f59e0b;
      --text-color: #f3f4f6;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* 상단 스탯 헤더 */
    .header-stats {
      width: 100%;
      max-width: 500px;
      padding: 12px 16px;
      background: rgba(15, 11, 26, 0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .gold-display {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--accent-gold);
      text-align: center;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sub-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 6px;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .secret-code-banner {
      display: none;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      margin-top: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }

    /* 메인 메인 컨테이너 */
    .main-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      padding-bottom: 80px; /* 하단 탭 공간 */
    }

    /* 탭 화면 제어 */
    .tab-content {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeIn 0.2s ease-in-out;
    }

    .tab-content.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 🎯 타격 탭 */
    .target-area {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .target-image-wrapper {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid var(--accent-color);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background-color: #1f1938;
      transition: transform 0.05s ease;
    }

    .target-image-wrapper:active {
      transform: scale(0.92);
    }

    .target-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .shake {
      animation: shakeAnim 0.15s ease-in-out;
    }

    @keyframes shakeAnim {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-6px, 4px) rotate(-3deg); }
      50% { transform: translate(6px, -4px) rotate(3deg); }
      75% { transform: translate(-4px, -2px) rotate(-1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* 파티클 및 뎀감 텍스트 */
    .click-effect {
      position: absolute;
      font-weight: 900;
      font-size: 1.5rem;
      color: #facc15;
      text-shadow: 0 0 8px #000;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 50;
    }

    .click-effect.crit {
      font-size: 2.2rem;
      color: #ef4444;
      text-shadow: 0 0 12px #fef08a;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }

    /* 이미지 업로드 영역 */
    .image-upload-box {
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
    }

    .custom-file-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      background: #374151;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* ⚔️ 상점 & 🤖 알바 리스트 */
    .shop-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .shop-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .shop-item.equipped {
      border-color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.1);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-icon {
      font-size: 2rem;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-details h4 {
      font-size: 1rem;
      color: #fff;
    }

    .item-details p {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    .buy-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-color), #7c3aed);
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      min-width: 90px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(168, 85, 247, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }

    .buy-btn:disabled {
      background: #374151;
      color: #6b7280;
      box-shadow: none;
      cursor: not-allowed;
    }

    .buy-btn:not(:disabled):active {
      transform: scale(0.95);
    }

    /* 하단 탭 바 (Mobile First Navigation) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 65px;
      background: rgba(15, 11, 26, 0.98);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.75rem;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn .nav-icon {
      font-size: 1.3rem;
    }

    .nav-btn.active {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* 팝업 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #1e1b2e;
      border: 2px solid var(--accent-gold);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .code-box {
      background: #000;
      color: var(--accent-gold);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 16px 0;
      border: 1px dashed var(--accent-gold);
      word-break: break-all;
    }

    .close-btn {
      padding: 10px 20px;
      background: var(--accent-gold);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 상단 스탯 영역 -->
  <header class="header-stats">
    <div class="gold-display">
      <span>💰</span> <span id="goldText">0</span> Gold
    </div>
    <div class="sub-stats">
      <span>공격력: <strong id="dpcText" style="color:#fff;">1</strong></span>
      <span>자동 DPS: <strong id="dpsText" style="color:#fff;">0</strong></span>
    </div>
    <div id="secretBanner" class="secret-code-banner">
      🔑 VIP 시크릿 코드: <span id="secretCodeText">JMsextankautomachine</span>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-container">

    <!-- 1. 🎯 타격 탭 -->
    <section id="tab-target" class="tab-content active">
      <div class="target-area">
        <div id="targetWrapper" class="target-image-wrapper">
          <img id="targetImg" class="target-img" src="assets/1.png" alt="지홍이" onerror="this.src='https://via.placeholder.com/220/4a2c82/ffffff?text=%EC%A7%80%ED%95%8D%EC%9D%B4'">
        </div>
      </div>

      <div class="image-upload-box">
        <p>📷 사진 연동: assets/1.png 적용 중</p>
        <label for="imgInput" class="custom-file-btn">사진 직접 변경하기</label>
        <input type="file" id="imgInput" accept="image/*" style="display:none;">
      </div>
    </section>

    <!-- 2. ⚔️ 무기 상점 탭 -->
    <section id="tab-weapons" class="tab-content">
      <h3 style="align-self: flex-start; margin-bottom: 10px; color: var(--accent-color);">⚔️ 무기 교체</h3>
      <div id="weaponList" class="shop-list"></div>
    </section>

    <!-- 3. 🤖 자동 알바 탭 -->
    <section id="tab-helpers" class="tab-content">
      <h3 style="align-self: flex-start; margin-bottom: 10px; color: var(--accent-color);">🤖 자동 타격 지원</h3>
      <div id="helperList" class="shop-list"></div>
    </section>

  </main>

  <!-- 하단 탭 메뉴 -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('target', this)">
      <span class="nav-icon">🎯</span>
      <span>타격</span>
    </button>
    <button class="nav-btn" onclick="switchTab('weapons', this)">
      <span class="nav-icon">⚔️</span>
      <span>무기 상점</span>
    </button>
    <button class="nav-btn" onclick="switchTab('helpers', this)">
      <span class="nav-icon">🤖</span>
      <span>자동 알바</span>
    </button>
  </nav>

  <!-- 시크릿 코드 해금 팝업 모달 -->
  <div id="codeModal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="color: var(--accent-gold);">🎉 VIP 코드 해금!</h2>
      <p style="margin-top: 8px; font-size: 0.9rem; color: #d1d5db;">
        자동 타격 알바 Lv.50을 달성하셨습니다!<br>특별 시크릿 코드가 해금되었습니다.
      </p>
      <div class="code-box">JMsextankautomachine</div>
      <p style="font-size: 0.75rem; color: #9ca3af; margin-bottom: 16px;">
        (이 코드는 상단 스탯창에 영구적으로 표시됩니다)
      </p>
      <button class="close-btn" onclick="closeModal()">확인 및 영구 저장</button>
    </div>
  </div>

  <script>
    /* 웹 오디오 SFX 엔진 */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSFX(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'feather') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'punch') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'slap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(200, now + 0.1);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'bat') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'gun' || type === 'smg') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'grenade') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(20, now + 0.4);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      }
    }

    /* 게임 데이터 정의 */
    const WEAPONS = [
      { id: 'feather', name: '🪶 깃털', dmg: 1, cost: 0, sfx: 'feather' },
      { id: 'fist', name: '👊 주먹', dmg: 5, cost: 15, sfx: 'punch' },
      { id: 'slap', name: '✋ 뺨 때리기', dmg: 25, cost: 80, sfx: 'slap' },
      { id: 'bat', name: '🏏 야구 방망이', dmg: 120, cost: 400, sfx: 'bat' },
      { id: 'pistol', name: '🔫 권총', dmg: 600, cost: 2000, sfx: 'gun' },
      { id: 'smg', name: '💥 기관단총', dmg: 3500, cost: 12000, sfx: 'smg' },
      { id: 'grenade', name: '💣 수류탄', dmg: 20000, cost: 70000, sfx: 'grenade' }
    ];

    let gameState = {
      gold: 0,
      currentWeaponIdx: 0,
      unlockedWeapons: [0],
      helperLevel: 0,
      codeUnlocked: false
    };

    // 로컬 스토리지 로드
    const saved = localStorage.getItem('jihong_clicker_save');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        gameState = { ...gameState, ...parsed };
      } catch(e) {}
    }

    /* DOM 요소 */
    const goldText = document.getElementById('goldText');
    const dpcText = document.getElementById('dpcText');
    const dpsText = document.getElementById('dpsText');
    const secretBanner = document.getElementById('secretBanner');
    const targetWrapper = document.getElementById('targetWrapper');
    const targetImg = document.getElementById('targetImg');
    const imgInput = document.getElementById('imgInput');
    const weaponListEl = document.getElementById('weaponList');
    const helperListEl = document.getElementById('helperList');
    const codeModal = document.getElementById('codeModal');

    /* UI 업데이트 */
    function updateUI() {
      goldText.innerText = Math.floor(gameState.gold).toLocaleString();
      
      const currentWeapon = WEAPONS[gameState.currentWeaponIdx];
      dpcText.innerText = currentWeapon.dmg.toLocaleString();

      const currentDPS = gameState.helperLevel * 10;
      dpsText.innerText = currentDPS.toLocaleString();

      if (gameState.codeUnlocked) {
        secretBanner.style.display = 'block';
      }

      // 무기 버튼 갱신
      WEAPONS.forEach((w, idx) => {
        const btn = document.getElementById(`w-btn-${idx}`);
        if (btn) {
          const isUnlocked = gameState.unlockedWeapons.includes(idx);
          const isEquipped = gameState.currentWeaponIdx === idx;

          if (isEquipped) {
            btn.innerText = '장착 중';
            btn.disabled = true;
          } else if (isUnlocked) {
            btn.innerText = '장착하기';
            btn.disabled = false;
          } else {
            btn.innerText = `${w.cost.toLocaleString()} G`;
            btn.disabled = gameState.gold < w.cost;
          }
        }
      });

      // 알바 버튼 갱신
      const helperBtn = document.getElementById('helper-buy-btn');
      const helperCost = getHelperCost();
      if (helperBtn) {
        helperBtn.innerText = `Lv.${gameState.helperLevel + 1} 강화 (${helperCost.toLocaleString()} G)`;
        helperBtn.disabled = gameState.gold < helperCost;
      }

      // 데이터 저장
      localStorage.setItem('jihong_clicker_save', JSON.stringify(gameState));
    }

    function getHelperCost() {
      return Math.floor(50 * Math.pow(1.15, gameState.helperLevel));
    }

    /* 타격 이펙트 및 처리 */
    function hitTarget(e) {
      const weapon = WEAPONS[gameState.currentWeaponIdx];
      
      // 크리티컬 15%
      const isCrit = Math.random() < 0.15;
      const damage = isCrit ? weapon.dmg * 2 : weapon.dmg;

      gameState.gold += damage;
      playSFX(weapon.sfx);

      // 화면 흔들림 애니메이션
      targetWrapper.classList.remove('shake');
      void targetWrapper.offsetWidth; // reflow
      targetWrapper.classList.add('shake');

      // 데미지 텍스트 생성
      const rect = targetWrapper.getBoundingClientRect();
      const x = e ? (e.clientX || (e.touches && e.touches[0].clientX)) : (rect.left + rect.width / 2);
      const y = e ? (e.clientY || (e.touches && e.touches[0].clientY)) : (rect.top + rect.height / 2);

      const el = document.createElement('div');
      el.className = `click-effect ${isCrit ? 'crit' : ''}`;
      el.innerText = `+${damage}${isCrit ? ' CRIT!' : ''}`;
      el.style.left = `${x - 20}px`;
      el.style.top = `${y - 30}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 600);

      updateUI();
    }

    targetWrapper.addEventListener('pointerdown', (e) => {
      hitTarget(e);
    });

    /* 무기 및 알바 상점 생성 */
    function initShop() {
      // 무기 목록
      weaponListEl.innerHTML = '';
      WEAPONS.forEach((w, idx) => {
        const div = document.createElement('div');
        div.className = `shop-item ${gameState.currentWeaponIdx === idx ? 'equipped' : ''}`;
        div.id = `w-card-${idx}`;
        div.innerHTML = `
          <div class="item-info">
            <div class="item-icon">${w.name.split(' ')[0]}</div>
            <div class="item-details">
              <h4>${w.name}</h4>
              <p>공격력 +${w.dmg.toLocaleString()}</p>
            </div>
          </div>
          <button id="w-btn-${idx}" class="buy-btn" onclick="handleWeaponClick(${idx})"></button>
        `;
        weaponListEl.appendChild(div);
      });

      // 알바 목록
      helperListEl.innerHTML = '';
      const helperDiv = document.createElement('div');
      helperDiv.className = 'shop-item';
      helperDiv.innerHTML = `
        <div class="item-info">
          <div class="item-icon">🤖</div>
          <div class="item-details">
            <h4>자동 타격 알바</h4>
            <p>초당 +<span id="helperDpsVal">${(gameState.helperLevel * 10).toLocaleString()}</span> Gold (Lv.<span id="helperLvlVal">${gameState.helperLevel}</span>)</p>
          </div>
        </div>
        <button id="helper-buy-btn" class="buy-btn" onclick="buyHelper()"></button>
      `;
      helperListEl.appendChild(helperDiv);

      updateUI();
    }

    function handleWeaponClick(idx) {
      const w = WEAPONS[idx];
      if (gameState.unlockedWeapons.includes(idx)) {
        gameState.currentWeaponIdx = idx;
      } else if (gameState.gold >= w.cost) {
        gameState.gold -= w.cost;
        gameState.unlockedWeapons.push(idx);
        gameState.currentWeaponIdx = idx;
      }
      initShop();
    }

    function buyHelper() {
      const cost = getHelperCost();
      if (gameState.gold >= cost) {
        gameState.gold -= cost;
        gameState.helperLevel += 1;

        // Lv.50 달성 시 시크릿 코드 해금
        if (gameState.helperLevel >= 50 && !gameState.codeUnlocked) {
          gameState.codeUnlocked = true;
          codeModal.style.display = 'flex';
        }

        document.getElementById('helperDpsVal').innerText = (gameState.helperLevel * 10).toLocaleString();
        document.getElementById('helperLvlVal').innerText = gameState.helperLevel;
        updateUI();
      }
    }

    function closeModal() {
      codeModal.style.display = 'none';
      updateUI();
    }

    /* 탭 전환 로직 */
    function switchTab(tabId, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabId}`).classList.add('active');
      btnEl.classList.add('active');
    }

    /* 커스텀 이미지 업로드 */
    imgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          targetImg.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    /* 자동 타격 타이머 (독립 백그라운드 루프) */
    setInterval(() => {
      if (gameState.helperLevel > 0) {
        const incomePerTick = (gameState.helperLevel * 10) / 10;
        gameState.gold += incomePerTick;
        updateUI();
      }
    }, 100);

    // 초기화
    initShop();
  </script>
</body>
</html>
